<!-- Tailwind CSS Play CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Alpine.js v3 -->
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<!-- Google Fonts: Noto Sans SC for CJK support -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
  body {
    font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Ensure the sidebar takes full viewport height on desktop */
  @media (min-width: 768px) {
    aside { position: sticky !important; }
  }
  /* On desktop the detail panel becomes a sticky column – override the mobile fixed/transform */
  @media (min-width: 1024px) {
    .detail-panel {
      position: sticky !important;
      top: 0;
      height: 100vh;
      width: 380px !important;
      transform: none !important;
      box-shadow: none !important;
      flex-shrink: 0;
    }
  }
  /* Prose styles for HTML content rendered inside the detail panel */
  .prose-detail img  { max-width: 100%; height: auto; border-radius: .5rem; margin: .5rem 0; }
  .prose-detail a    { color: #e8649a; text-decoration: underline; overflow-wrap: break-word; }
  .prose-detail p    { margin-bottom: .75rem; }
  .prose-detail h1,
  .prose-detail h2,
  .prose-detail h3   { font-weight: 600; margin-bottom: .5rem; color: #2d2d2d; }
  .prose-detail ul,
  .prose-detail ol   { padding-left: 1.25rem; margin-bottom: .75rem; }
  .prose-detail li   { margin-bottom: .25rem; }
  .prose-detail blockquote {
    border-left: 3px solid #ffa0bf;
    padding-left: .75rem;
    color: #777;
    font-style: italic;
    margin: .5rem 0;
  }
</style>
