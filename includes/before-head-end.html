<!-- Tailwind CSS Play CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- DOMPurify – must load before Alpine -->
<script src="./purify.min.js"></script>

<!-- Alpine.js v3 (local copy, no CDN) -->
<script defer src="./alpine.min.js"></script>

<style>
  /* Hide Alpine-controlled elements until Alpine has initialised */
  [x-cloak] { display: none !important; }
  /* Keep the mobile sidebar off-screen before Alpine initialises.
     Element selector (0,0,1) is intentionally weaker than Tailwind's class
     utilities (0,1,0), so Alpine's translate-x-0 / -translate-x-full
     classes always take precedence once the JS runs. */
  @media (max-width: 767px) {
    aside { transform: translateX(-100%); }
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Ensure the sidebar takes full viewport height on desktop */
  @media (min-width: 768px) {
    aside { position: sticky !important; }
  }
  /* On desktop the detail panel becomes a sticky column – override the mobile fixed/transform */
  @media (min-width: 1024px) {
    .detail-panel {
      position: sticky !important;
      top: 0;
      height: 100vh;
      width: 380px !important;
      transform: none !important;
      box-shadow: none !important;
      flex-shrink: 0;
    }
  }
  /* Prose styles for HTML content rendered inside the detail panel */
  .prose-detail img  { max-width: 100%; height: auto; border-radius: .5rem; margin: .5rem 0; }
  .prose-detail a    { color: #e8649a; text-decoration: underline; overflow-wrap: break-word; }
  .prose-detail p    { margin-bottom: .75rem; }
  .prose-detail h1,
  .prose-detail h2,
  .prose-detail h3   { font-weight: 600; margin-bottom: .5rem; color: #2d2d2d; }
  .prose-detail ul,
  .prose-detail ol   { padding-left: 1.25rem; margin-bottom: .75rem; }
  .prose-detail li   { margin-bottom: .25rem; }
  .prose-detail blockquote {
    border-left: 3px solid #ffa0bf;
    padding-left: .75rem;
    color: #777;
    font-style: italic;
    margin: .5rem 0;
  }
</style>
